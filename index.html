<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#8a1c2b" />
    <meta name="format-detection" content="telephone=yes" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/images/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Performance: warm up third-party origins used by the site -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.google.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    />

    <!--
      Fallback metadata for dev and for the plain SPA build. The prerenderer
      strips this whole block and substitutes the real per-route tags, so a
      page never ends up with two title elements (the first would win).
      Keep the delimiter comments intact.
    -->
    <!--fallback-seo-start-->
    <title>Shekhawat Tours and Travels — Car Rental &amp; Bus Hire in Delhi NCR</title>
    <meta
      name="description"
      content="Book cars, tempo travellers, mini buses and luxury coaches on rent with experienced drivers in Delhi NCR. Outstation taxi, IGI airport transfer, wedding car hire and Rajasthan tour packages at fixed rates. Available 24×7."
    />
    <!--fallback-seo-end-->

    <!--app-head-->
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Deliberately no top-level heading element here: each page prerenders
         its own, and a second one would compete with it in the document
         outline that crawlers build. -->
    <noscript>
      <div style="padding:24px;font-family:system-ui,sans-serif;text-align:center">
        <p style="font-size:1.5rem;font-weight:700">Shekhawat Tours and Travels</p>
        <p>
          Car rental, tempo traveller and bus hire across Delhi NCR, Rajasthan and all India.
          Call <a href="tel:+917982471997">+91 79824 71997</a> to book.
        </p>
      </div>
    </noscript>
  </body>
</html>
